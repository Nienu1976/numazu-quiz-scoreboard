<title>2R 競り札モック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Big+Shoulders+Stencil+Display:wght@700;900&family=BIZ+UDPGothic:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion（会場で観客が見る）／操作部は work
   IDEA 沼津港の競り札の「見た目」だけを借りた、連答つき5○2× の得点板。言葉と演出はクイズとして正しく
   PICTURE 16:9 の得点板（札12枚）。下の操作ストリップで動く
   COLOUR 駿河湾の藍の地、生成りの札、黒板、船体の赤、プレート色は帯のみ、連答権は信号灯の緑
   TYPE Dela Gothic One（札・看板）＋ Big Shoulders Stencil（番号標識の数字）＋ BIZ UDPゴシック（操作）
   LAYOUT 上 約72% に投影画面（見出し＋ルール表示、札 6×2）、下に 名前/○/× の3行ストリップ＋右に戻す/スルー */
:root{color-scheme:dark;--ai:#0e2240;--sea:#0a1a33;--kinari:#e9dfc6;--kinari2:#d8ccad;--shiro:#f6f3ec;--aka:#c8102e;--sabi:#8c3f1e;--koku:#1f2b26;--chalk:#eef0e6;--sig:#3ee08f;--ink:#141414;
--p-r:#c8102e;--p-b:#2058b8;--p-y:#f0b400;--p-g:#1d8a4b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--shiro);font:15px/1.4 "BIZ UDPGothic",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:none;display:grid;place-items:center;padding:12px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px))}
.stage{position:relative;container-type:inline-size;width:min(100%,calc(70dvh*16/9));aspect-ratio:16/9;background:var(--ai);overflow:hidden;border:2px solid #000}
.stage *{line-height:1}
/* 見出し＋ルール */
.hd{position:absolute;left:2cqw;right:2cqw;top:1.6cqw;height:7cqw;display:flex;gap:1.6cqw}
.no{background:var(--shiro);color:var(--ink);border:.5cqw solid var(--aka);width:7cqw;display:grid;place-items:center;font:900 5cqw "Big Shoulders Stencil Display",Impact,sans-serif}
.tt{display:flex;flex-direction:column;justify-content:center;gap:.9cqw}
.tt h1{margin:0;font:400 2.7cqw "Dela Gothic One",sans-serif;letter-spacing:-.02em}
.tt p{margin:0;font:400 1.5cqw "Dela Gothic One",sans-serif;color:var(--kinari2)}
.rules{margin-left:auto;display:flex;gap:.5cqw}
.rule{background:var(--shiro);color:var(--ink);border:.2cqw solid #000;padding:0 1cqw;display:flex;flex-direction:column;justify-content:center;gap:.6cqw}
.rule b{font:900 3cqw "Big Shoulders Stencil Display",sans-serif}
.rule span{font:700 1.1cqw "BIZ UDPGothic",sans-serif;white-space:nowrap}
.rule.ren{background:var(--koku);color:var(--chalk)}
.rule.ren b{color:var(--sig)}
.rule.left{background:var(--aka);color:var(--shiro)}
/* 札 */
.grid{position:absolute;left:2cqw;right:2cqw;top:12.6cqw;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:1.4cqw;row-gap:4.2cqw}
.card{position:relative;height:18.4cqw;perspective:60cqw}
.flip{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:.22cqw solid #000}
.front{background:var(--kinari);color:var(--ink);display:flex;flex-direction:column}
.back{background:var(--sabi);color:var(--kinari);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.9cqw;padding-top:1.6cqw}
.back .n2{font:400 2.1cqw "Dela Gothic One",sans-serif}
.back .k2{font:700 1.15cqw "BIZ UDPGothic",sans-serif;opacity:.8}
.back .big{font:400 3cqw "Dela Gothic One",sans-serif;border:.3cqw solid var(--kinari);padding:.5cqw .7cqw;margin-top:.4cqw}
.band{height:3.4cqw;display:flex;align-items:center;justify-content:space-between;padding:0 .8cqw;color:var(--shiro)}
.r .band{background:var(--p-r)}.b .band{background:var(--p-b)}.y .band{background:var(--p-y);color:var(--ink)}.g .band{background:var(--p-g)}
.seat{font:900 2.7cqw "Big Shoulders Stencil Display",sans-serif}
.chip{display:none;background:var(--sig);color:#062814;font:400 1.15cqw "Dela Gothic One",sans-serif;padding:.4cqw .5cqw;border:.15cqw solid #000}
.rt .chip{display:block}
.nm{font:400 2.2cqw "Dela Gothic One",sans-serif;padding:1.1cqw .8cqw 0;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.ki{font:700 1.2cqw "BIZ UDPGothic",sans-serif;padding:.55cqw .8cqw 0;color:#5a5244}
.tag{margin:auto .8cqw .8cqw;background:var(--koku);color:var(--chalk);height:7cqw;display:flex;align-items:center;justify-content:space-between;padding:0 .9cqw;perspective:20cqw;transform-origin:50% 50%}
.num{font:900 6.2cqw "Big Shoulders Stencil Display",sans-serif;display:inline-block;transform-origin:50% 50%}
.num small{font:400 1.6cqw "Dela Gothic One",sans-serif;margin-left:.3cqw;color:#b9c2b2}
.xs{display:flex;flex-direction:column;gap:.4cqw}
.xs i{width:2.1cqw;height:2.1cqw;border:.2cqw solid #8a7e6e;display:grid;place-items:center;font:900 1.8cqw "BIZ UDPGothic",sans-serif;font-style:normal;color:transparent}
.xs i.on{background:var(--sabi);border-color:var(--sabi);color:var(--kinari)}
.wn,.wn2{display:none}
.wn{align-items:baseline;gap:.3cqw}
.wn b{font:900 5.4cqw "Big Shoulders Stencil Display",sans-serif}
.wn em{font:400 2.4cqw "Dela Gothic One",sans-serif;font-style:normal}
.wn2{font:400 1.5cqw "Dela Gothic One",sans-serif;writing-mode:vertical-rl;letter-spacing:.1em}
/* 勝ち抜け：名前はそのまま。下の黒板が赤に変わり「1抜け」 */
.win .front{background:var(--shiro);outline:.35cqw solid var(--aka);outline-offset:.15cqw}
.win .tag{background:var(--aka);color:var(--shiro)}
.val{display:contents}
.win .val{display:none}
.win .wn{display:flex}
.win .wn2{display:block}
.win .mast{opacity:.25}
/* 連答権：回転灯（持っている間ずっと回る） */
.mast{position:absolute;right:1.4cqw;top:-3.9cqw;width:2.6cqw;height:3.9cqw;z-index:5;pointer-events:none}
.mast::before{content:"";position:absolute;left:1.15cqw;top:2.3cqw;width:.3cqw;height:1.6cqw;background:#000}
.lamp{position:absolute;left:.15cqw;top:0;width:2.3cqw;height:2.3cqw;background:#33425a;border:.22cqw solid #000;z-index:2}
.rot{position:absolute;left:1.3cqw;top:1.15cqw;width:10cqw;height:3cqw;margin:-1.5cqw 0 0 -5cqw;background:var(--sig);opacity:0;clip-path:polygon(0 0,50% 44%,100% 0,100% 100%,50% 56%,0 100%)}
.rt .lamp{background:#c9ffe0;box-shadow:0 0 1.2cqw .5cqw var(--sig),0 0 3cqw 1cqw rgba(62,224,143,.45);animation:pulse .6s steps(2) infinite}
.rt .rot{opacity:.42;animation:spin 1.1s linear infinite}
.rt .front{outline:.35cqw solid var(--sig);outline-offset:.15cqw}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{background:var(--sig)}}
@media(prefers-reduced-motion:reduce){.rt .rot{animation:none}.rt .lamp{animation:none}}
/* 失格：裏返って錆色、沈む（名前は裏面にも出す） */
.out .flip{transform:rotateY(180deg)}
.out{translate:0 .7cqw}
.sea{position:absolute;left:-.3cqw;right:-.3cqw;bottom:-.3cqw;height:0;background:var(--sea);clip-path:polygon(0 1.2cqw,8% 0,16% 1.2cqw,24% 0,32% 1.2cqw,40% 0,48% 1.2cqw,56% 0,64% 1.2cqw,72% 0,80% 1.2cqw,88% 0,96% 1.2cqw,100% .4cqw,100% 100%,0 100%);z-index:2}
.out .sea{height:24%}
.out .mast{opacity:.25}
.pop{position:absolute;left:50%;top:-1.4cqw;transform:translateX(-50%);white-space:nowrap;font:400 2.4cqw "Dela Gothic One",sans-serif;color:var(--shiro);z-index:6;pointer-events:none;padding:.5cqw .8cqw;background:var(--ink);border:.2cqw solid var(--shiro)}
.pop.ren{background:var(--sig);color:#062814;border-color:#000;font-size:3cqw}
.flash{position:absolute;left:0;right:0;top:40%;height:11cqw;background:var(--aka);color:var(--shiro);display:flex;align-items:center;justify-content:center;gap:2.4cqw;font:400 4.6cqw "Dela Gothic One",sans-serif;border-block:.6cqw solid var(--shiro);z-index:10;visibility:hidden}
.flash small{font:900 3.6cqw "Big Shoulders Stencil Display",sans-serif}
/* 操作ストリップ */
.ctl{flex:1;min-height:0;background:var(--kinari);color:var(--ink);border-top:4px solid var(--aka);display:flex;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.strip{flex:1;overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(12,minmax(64px,1fr));gap:4px;min-width:820px;height:100%;grid-template-rows:auto 1fr 1fr}
.who{background:var(--shiro);border:2px solid var(--ink);padding:5px 6px 6px;display:flex;flex-direction:column;gap:3px}
.who .t{display:flex;justify-content:space-between;align-items:center;gap:4px}
.who .sn{font:900 19px "Big Shoulders Stencil Display",sans-serif;color:#fff;padding:0 5px}
.who.r .sn{background:var(--p-r)}.who.b .sn{background:var(--p-b)}.who.y .sn{background:var(--p-y);color:#000}.who.g .sn{background:var(--p-g)}
.who .st{font-size:13px;white-space:nowrap}
.who .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .rk{font-size:12px;background:var(--sig);color:#062814;padding:1px 4px;align-self:flex-start}
.who.done{opacity:.5}
.cols button{color:#fff;font:700 28px "BIZ UDPGothic",sans-serif;border:2px solid var(--ink);cursor:pointer;min-height:40px}
.bo{background:var(--aka)}
.bx{background:var(--ai)}
.cols button:hover:not(:disabled){outline:3px solid var(--p-y);outline-offset:-5px}
.cols button:active:not(:disabled){translate:0 2px}
.cols button:disabled{background:var(--kinari2);color:#8d8371;border-color:#a89c80;cursor:not-allowed;font-size:13px}
.side{width:200px;flex:none;display:flex;flex-direction:column;gap:6px}
.side button{color:var(--ink);font:700 16px "BIZ UDPGothic",sans-serif;border:2px solid var(--ink);cursor:pointer;padding:8px}
.undo{background:var(--p-y);font-size:20px!important;flex:1}
.thru{background:var(--shiro)}
.rst{background:transparent;font-size:13px!important;padding:4px!important}
.last{font-size:13px;background:var(--koku);color:var(--chalk);padding:6px 8px;min-height:2.6em}
@media(max-width:700px){.side{width:120px}.undo{font-size:16px!important}}
</style>

<div class="wrap"><div class="stage" id="stage">
  <div class="hd">
    <div class="no">2R</div>
    <div class="tt"><h1>第2ラウンド　連答つき 5○2×</h1><p>第1組</p></div>
    <div class="rules">
      <div class="rule"><b>5○</b><span>勝ち抜け</span></div>
      <div class="rule"><b>2×</b><span>失格</span></div>
      <div class="rule ren"><b>2○</b><span>連答権中の正解</span></div>
      <div class="rule left"><b id="left">6</b><span>勝ち抜け枠 残り</span></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="flash" id="flash"></div>
</div></div>

<div class="ctl">
  <div class="strip"><div class="cols" id="cols"></div></div>
  <div class="side">
    <button class="undo" id="undo">1手戻す</button>
    <button class="thru" id="thru">スルー</button>
    <div class="last" id="lastC">操作はまだありません</div>
    <button class="rst" id="rst">最初から（ダミーに戻す）</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
{
/* ルール解釈（暫定。主催者確認待ち）
   - 連答権中の正解: 2○獲得。その後、連答権は継続しない
   - 連答権のない正解: 1○獲得し、連答権を得る（他の人の連答権は消える）
   - 誤答: 1×。自分の連答権は消える
   - スルー: 連答権は維持
   - 5○を超えた場合: 表示は5○で止めて勝ち抜け */
const G = window.gsap;
const INIT = {r:3,b:2,y:1,g:0};
const PEOPLE = [["しおかぜ",48,"g"],["ぬまっこ",52,"b"],["カツオ番長",39,"y"],["ひもの",55,"g"],["千本松",44,"r"],["香貫山",50,"g"],
  ["ゆりかもめ",57,"y"],["アジフライ",46,"g"],["狩野川",41,"b"],["深海魚",53,"g"],["びゅうお",49,"y"],["我入道",58,"g"]];
const WIN = 5, LOSE = 2, SEATS = 6, GROUP = 1;
const fresh = () => ({p:PEOPLE.map(([n,k,c]) => ({n,k,c,o:INIT[c],x:0,st:"play",rank:0})), holder:null, winners:[], last:"", done:false});
let S = fresh(), H = [];
const $ = id => document.getElementById(id);
const stage = $("stage"), grid = $("grid"), cols = $("cols"), flash = $("flash");
const pad = i => String(i+1).padStart(2,"0");

grid.innerHTML = S.p.map((p,i) => `
<div class="card ${p.c}">
  <div class="mast"><i class="rot"></i><div class="lamp"></div></div>
  <div class="flip">
    <div class="face front">
      <div class="band"><span class="seat">${pad(i)}</span><span class="chip">連答権</span></div>
      <div class="nm"></div><div class="ki"></div>
      <div class="tag"><span class="val"><span class="num"></span><span class="xs">${"<i>×</i>".repeat(LOSE)}</span></span>
        <span class="wn"><b></b><em>抜け</em></span><span class="wn2">勝ち抜け</span></div>
    </div>
    <div class="face back"><span class="n2"></span><span class="k2"></span><span class="big">失格</span></div>
  </div>
  <div class="sea"></div>
</div>`).join("");
const cards = [...grid.children];
cards.forEach((c,i) => {
  const p = S.p[i];
  c.querySelector(".nm").textContent = c.querySelector(".n2").textContent = p.n;
  c.querySelector(".ki").textContent = c.querySelector(".k2").textContent = `第${p.k}期`;
});
const q = (c, s) => c.querySelector(s);
const setNum = (c, o) => q(c,".num").innerHTML = `${o}<small>○</small>`;

function rc(i){
  const p = S.p[i], c = cards[i];
  if (G) G.set([c, q(c,".flip"), q(c,".tag"), q(c,".sea"), q(c,".num"), q(c,".chip"), ...c.querySelectorAll(".xs i")], {clearProps:"all"});
  c.classList.toggle("win", p.st==="win");
  c.classList.toggle("out", p.st==="out");
  c.classList.toggle("rt", S.holder===i);
  setNum(c, p.o);
  q(c,".wn b").textContent = p.rank;
  c.querySelectorAll(".xs i").forEach((e,k) => e.classList.toggle("on", k < p.x));
}
function renderCtl(){
  const lbl = p => p.st==="win" ? `${p.rank}抜け` : p.st==="out" ? "失格" : `${p.o}○ ${p.x}×`;
  cols.innerHTML =
    S.p.map((p,i) => `<div class="who ${p.c} ${p.st!=="play"?"done":""}"><div class="t"><span class="sn">${pad(i)}</span><span class="st">${lbl(p)}</span></div><span class="n">${p.n}</span>${S.holder===i?'<span class="rk">連答権</span>':""}</div>`).join("") +
    S.p.map((p,i) => `<button class="bo" data-a="o" data-i="${i}" ${p.st!=="play"||S.done?"disabled":""}>${p.st==="win"?"勝ち抜け":p.st==="out"?"失格":"○"}</button>`).join("") +
    S.p.map((p,i) => `<button class="bx" data-a="x" data-i="${i}" ${p.st!=="play"||S.done?"disabled":""}>${p.st==="play"?"×":"—"}</button>`).join("");
  $("left").textContent = SEATS - S.winners.length;
  $("lastC").textContent = S.last ? `直前: ${S.last}` : "操作はまだありません";
  $("undo").disabled = !H.length;
}
function renderAll(){
  if (G) { G.killTweensOf("*"); G.set([stage, flash], {clearProps:"all"}); }
  document.querySelectorAll(".pop").forEach(e => e.remove());
  cards.forEach((_,i) => rc(i)); renderCtl();
  flash.style.visibility = S.done ? "visible" : "hidden";
  if (S.done) flash.textContent = `第${GROUP}組 終了`;
}

/* ---- 演出 ---- */
const u = k => stage.offsetWidth * k / 100;   // cqw → px
function flipNum(c, o){
  const n = q(c,".num");
  G.timeline().to(n, {rotateX:90, duration:.12, ease:"power1.in", onComplete:() => setNum(c, o)})
    .fromTo(n, {rotateX:-90}, {rotateX:0, duration:.45, ease:"back.out(3)"});
}
function hop(c){ G.timeline().to(c, {y:-u(1.4), duration:.15, ease:"power2.out"}).to(c, {y:0, duration:.6, ease:"bounce.out"}); }
function pop(c, text, ren){
  const e = document.createElement("div"); e.className = "pop" + (ren ? " ren" : ""); e.textContent = text; c.appendChild(e);
  G.timeline({onComplete:() => e.remove()})
    .fromTo(e, {y:u(2), scale:ren?1.8:1, opacity:0}, {y:0, scale:1, opacity:1, duration:ren?.35:.25, ease:ren?"back.out(3)":"power2.out"})
    .to(e, {y:-u(2.5), opacity:0, duration:.5, ease:"power1.in", delay:ren?1.1:.6});
}
function chipIn(c){ G.fromTo(q(c,".chip"), {scale:2.4, opacity:0}, {scale:1, opacity:1, duration:.35, ease:"back.out(3)"}); }
function winShow(i){
  const p = S.p[i], c = cards[i], tag = q(c,".tag");
  G.timeline({delay:.45})
    .to(tag, {rotateX:90, duration:.16, ease:"power1.in"})
    .add(() => rc(i))
    .fromTo(tag, {rotateX:-90}, {rotateX:0, duration:.5, ease:"back.out(2.5)"})
    .fromTo(stage, {x:-u(.6)}, {x:0, duration:.5, ease:"elastic.out(1.2,.25)"}, "<")
    .add(() => { flash.innerHTML = `<small>${p.rank}抜け</small>${p.n}<small>${pad(i)}</small>`; flash.style.visibility = "visible"; }, "<")
    .fromTo(flash, {xPercent:-100}, {xPercent:0, duration:.28, ease:"power3.out"}, "<")
    .to(flash, {xPercent:100, duration:.3, ease:"power3.in", delay:.9})
    .add(() => { flash.style.visibility = "hidden"; G.set(flash, {clearProps:"all"}); if (S.done) endShow(); });
}
function endShow(){
  flash.textContent = `第${GROUP}組 終了`; flash.style.visibility = "visible";
  G.fromTo(flash, {scaleY:0}, {scaleY:1, duration:.4, ease:"back.out(2)"});
}
function sink(i){
  const c = cards[i];
  G.timeline({delay:.35})
    .to(q(c,".flip"), {rotateY:180, duration:.75, ease:"power2.inOut"})
    .to(q(c,".sea"), {height:"24%", duration:1.1, ease:"power1.inOut"}, "-=.2")
    .to(c, {y:u(.7), duration:1.1, ease:"power1.inOut"}, "<")
    .add(() => rc(i));
}

/* ---- ルール ---- */
function act(kind, i){
  if (S.done) return;
  if (kind!=="thru" && S.p[i].st!=="play") return;
  H.push(JSON.stringify(S));
  const prev = S.holder;
  if (kind==="thru"){ S.last = "スルー（連答権はそのまま）"; renderCtl(); return; }
  const p = S.p[i], c = cards[i];
  if (kind==="o"){
    const gain = prev===i ? 2 : 1;
    p.o = Math.min(WIN, p.o + gain);
    S.holder = gain===2 ? null : i;
    if (p.o >= WIN){ p.st = "win"; S.winners.push(i); p.rank = S.winners.length; S.holder = null; }
    if (S.winners.length >= SEATS) S.done = true;
    S.last = `${pad(i)} ${p.n} ○ ${gain===2?"連答 +2":"+1"}${p.st==="win"?` → ${p.rank}抜け`:S.holder===i?"（連答権）":""}`;
    renderCtl();
    if (!G){ renderAll(); return; }
    if (prev!==null && prev!==i) cards[prev].classList.remove("rt");
    flipNum(c, p.o); hop(c);
    pop(c, gain===2 ? "連答 +2" : "+1", gain===2);
    if (S.holder===i){ c.classList.add("rt"); chipIn(c); } else c.classList.remove("rt");
    if (p.st==="win") winShow(i);
  } else {
    p.x++;
    if (prev===i) S.holder = null;
    if (p.x >= LOSE) p.st = "out";
    S.last = `${pad(i)} ${p.n} ×${p.st==="out"?" → 失格":""}`;
    renderCtl();
    if (!G){ renderAll(); return; }
    const box = c.querySelectorAll(".xs i")[p.x-1];
    box.classList.add("on");

    if (prev===i) c.classList.remove("rt");
    if (p.st==="out") sink(i);
  }
}
